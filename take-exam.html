<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exam - My LMS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <a id="backLink" href="dashboard.html">&larr; Back to course</a>
  <h1 id="examTitle">Loading...</h1>
  <h2 id="timer"></h2>

  <div id="intro" style="display:none">
    <p id="introText"></p>
    <button id="startBtn">Start exam</button>
  </div>

  <div id="examBox" style="display:none">
    <div id="questions"></div>
    <button id="submitBtn">Submit answers</button>
  </div>

  <div id="resultBox" style="display:none">
    <h2>Your result</h2>
    <p id="resultText"></p>
  </div>

  <p id="msg"></p>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="site.js"></script>
  <script src="take-exam.js"></script>
</body>
</html>

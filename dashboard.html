<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - My LMS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1 id="welcome">Loading...</h1>
  <p id="roleText"></p>
  <button id="logoutBtn">Log out</button>

  <!-- Only teachers will see this part -->
  <div id="teacherPanel" style="display:none">
    <h2>Create a course</h2>
    <input id="courseTitle" placeholder="Course title"><br><br>
    <textarea id="courseDesc" placeholder="Short description"></textarea><br><br>
    <button id="createCourseBtn">Create course</button>
    <p id="courseMessage"></p>
  </div>

    <!-- Only students will see this part -->
  <div id="studentResults" style="display:none">
    <h2>My results</h2>
    <p id="myAverage"></p>
    <div style="overflow-x:auto">
      <table id="myResults" border="1" cellpadding="6" cellspacing="0"></table>
    </div>
  </div>
  <h2>My courses</h2>
  <ul id="myCourses"></ul>

  <h2>Available courses</h2>
  <ul id="courseList"></ul>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="site.js"></script>
  <script src="dashboard.js"></script>
</body>
</html>

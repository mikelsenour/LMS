<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Results - My LMS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <a id="backLink" href="dashboard.html">&larr; Back to course</a>
  <h1 id="pageTitle">Loading...</h1>
  <p id="msg"></p>

  <h2>Summary</h2>
  <ul id="summary"></ul>

  <h2>Scores</h2>
  <div style="max-width:700px">
    <canvas id="scoreChart"></canvas>
  </div>

  <h2>Students</h2>
  <div style="overflow-x:auto">
    <table id="studentTable" border="1" cellpadding="6" cellspacing="0"></table>
  </div>

  <h2>Question analysis</h2>
  <p>The percentage of students who answered each question correctly.</p>
  <div style="overflow-x:auto">
    <table id="questionTable" border="1" cellpadding="6" cellspacing="0"></table>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script src="config.js"></script>
  <script src="site.js"></script>
  <script src="results.js"></script>
</body>
</html>

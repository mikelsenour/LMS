<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Course - My LMS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <a href="dashboard.html">&larr; Back to dashboard</a>
  <h1 id="courseTitle">Loading...</h1>
  <p id="courseDesc"></p>
  <!-- Only enrolled students will see this -->
  <div id="progressBox" style="display:none">
    <h2>My progress</h2>
    <p id="progressText"></p>
    <p id="certArea"></p>
  </div>

  <!-- Only the course's teacher sees this -->
  <div id="teacherPanel" style="display:none">
    <h2>Course settings</h2>
    <p>Pass mark:
      <input id="passMark" type="number" min="1" max="100" value="60" style="width:60px"> %
      <button id="savePassBtn">Save</button>
      <span id="passMsg"></span>
    </p>
    <h2>Upload a PDF</h2>
    <p><a id="createExamLink" href="#">+ Create an exam for this course</a></p>
    <input id="matTitle" placeholder="Title, e.g. Chapter 1 Notes"><br><br>
    <input id="matFile" type="file" accept="application/pdf"><br><br>
    <button id="uploadBtn">Upload</button>
    <p id="uploadMsg"></p>
    <h2>Create an assignment</h2>
    <input id="asTitle" placeholder="Assignment title"><br><br>
    <textarea id="asDesc" placeholder="Instructions for students"></textarea><br><br>
    Due date: <input id="asDue" type="datetime-local"><br><br>
    Marks out of: <input id="asMax" type="number" min="1" value="100" style="width:70px"><br><br>
    <button id="assignBtn">Create assignment</button>
    <p id="assignMsg"></p>
      <h2>Add a video</h2>
    <input id="vidTitle" placeholder="Video title"><br><br>
    <input id="vidUrl" placeholder="Paste YouTube link"><br><br>
    <button id="videoBtn">Add video</button>
    <p id="videoMsg"></p>
  </div>

  <h2>Materials</h2>
  <ul id="materialList"></ul>
  <h2>Assignments</h2>
  <ul id="assignmentList"></ul>
  <h2>Exams</h2>
  <ul id="examList"></ul>
    <h2>Videos</h2>
  <div id="videoList"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="course.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Course - My LMS</title>
</head>
<body>
  <a href="dashboard.html">&larr; Back to dashboard</a>
  <h1 id="courseTitle">Loading...</h1>
  <p id="courseDesc"></p>

  <!-- Only the course's teacher sees this -->
  <div id="teacherPanel" style="display:none">
    <h2>Upload a PDF</h2>
    <input id="matTitle" placeholder="Title, e.g. Chapter 1 Notes"><br><br>
    <input id="matFile" type="file" accept="application/pdf"><br><br>
    <button id="uploadBtn">Upload</button>
    <p id="uploadMsg"></p>
  </div>

  <h2>Materials</h2>
  <ul id="materialList"></ul>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="course.js"></script>
</body>
</html>
